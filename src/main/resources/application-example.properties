spring.application.name=recruitease

spring.datasource.url=jdbc:mysql://localhost:3306/recruitease
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

app.main-admin.username=YOUR_MAIN_ADMIN_USERNAME
app.main-admin.password=YOUR_MAIN_ADMIN_PASSWORD
app.main-admin.email=YOUR_MAIN_ADMIN_EMAIL

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_PROJECT_EMAIL
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.jwt.secret=YOUR_BASE64_JWT_SECRET
app.jwt.expiration-ms=28800000
app.security.enforce-jwt=false