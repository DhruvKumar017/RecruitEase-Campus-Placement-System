<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Drives - RecruitEase</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            color: #ffffff;
            background:
                radial-gradient(circle at 15% 10%, rgba(47,128,255,.20), transparent 28%),
                radial-gradient(circle at 85% 90%, rgba(124,58,237,.20), transparent 30%),
                #050816;
            display: grid;
            place-items: center;
            padding: 28px;
        }

        .upcoming-card {
            width: 100%;
            max-width: 820px;
            padding: 40px;
            border: 1px solid rgba(96,165,250,.25);
            border-radius: 26px;
            background: rgba(13,19,37,.90);
            box-shadow: 0 30px 80px rgba(0,0,0,.55);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 28px;
        }

        .logo span {
            color: #2f80ff;
        }

        .drive-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 38px;
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            box-shadow: 0 15px 35px rgba(47,128,255,.30);
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aebbd1;
            margin-bottom: 30px;
        }

        #drivesContainer {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .drive-box {
            padding: 22px;
            border: 1px solid #263a5f;
            border-radius: 18px;
            background: #0f172a;
        }

        .drive-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .company-name {
            font-size: 22px;
            font-weight: 700;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            background: rgba(124,58,237,.18);
            color: #c4a5ff;
            font-size: 13px;
            font-weight: 700;
        }

        .drive-details {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
        }

        .detail {
            padding: 13px;
            background: #0b1326;
            border: 1px solid #1d3154;
            border-radius: 12px;
        }

        .detail span {
            display: block;
            color: #8294b3;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail strong {
            font-size: 14px;
        }

        .loading,
        .empty {
            text-align: center;
            color: #aebbd1;
            padding: 30px 10px;
        }
        .apply-btn {
    width: 100%;
    height: 52px;
    margin-top: 20px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #2563eb, #2f80ff);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
}

.apply-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 18px 38px rgba(37, 99, 235, 0.38);
}

.apply-btn:disabled {
    background: #1e293b;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
}

        .back-link {
            display: block;
            margin-top: 25px;
            color: #79b2ff;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: #c084fc;
        }

        @media(max-width:600px) {
            body {
                padding: 16px;
            }

            .upcoming-card {
                padding: 25px;
            }

            .drive-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="upcoming-card">

    <div class="logo">
        🎓 Recruit<span>Ease</span>
    </div>

    <div class="drive-icon">⌛</div>

    <h1>Upcoming Placement Drives</h1>

    <p class="subtitle">
        View your upcoming placement opportunities.
    </p>

    <div id="drivesContainer">
        <div class="loading">Loading upcoming drives...</div>
    </div>

    <a href="student-applications.html" class="back-link">
        ← Back to My Applications
    </a>

</div>

<script>

    const studentId = localStorage.getItem("studentId");

    async function loadUpcomingDrives() {

        const container = document.getElementById("drivesContainer");

        if (!studentId) {
            container.innerHTML =
                `<div class="empty">Student login information not found.</div>`;
            return;
        }

        try {

            const response = await fetch(
                "/api/student-placement-drives/" + studentId
            );

            if (!response.ok) {
                throw new Error("Unable to load drives.");
            }

            const drives = await response.json();

            const upcomingDrives = drives.filter(drive =>
                String(drive.status || "")
                    .trim()
                    .toLowerCase() === "upcoming"
            );

            if (upcomingDrives.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No upcoming placement drives available.
                    </div>
                `;

                return;
            }

            container.innerHTML = upcomingDrives.map(drive => `

                <div class="drive-box">

                    <div class="drive-top">

                        <div>
                            <div class="company-name">
                                ${drive.companyName || "Company"}
                            </div>

                            <div style="color:#8ea2c2; margin-top:4px;">
                                ${drive.jobRole || "Role Not Available"}
                            </div>
                        </div>

                        <div class="status">
                            Upcoming
                        </div>

                    </div>

                    <div class="drive-details">

                        <div class="detail">
                            <span>Package</span>
                            <strong>
                                ${drive.packageLpa != null
                                    ? "₹ " + drive.packageLpa + " LPA"
                                    : "Not Available"}
                            </strong>
                        </div>

                        <div class="detail">
                            <span>Drive Date</span>
                            <strong>
                                ${formatDate(drive.driveDate)}
                            </strong>
                        </div>

                        <div class="detail">
                            <span>Last Date</span>
                            <strong>
                                ${formatDate(drive.lastDate)}
                            </strong>
                        </div>

                        <div class="detail">
                            <span>Mode</span>
                            <strong>
                                ${drive.mode || "Not Available"}
                            </strong>
                        </div>

                        <div class="detail">
                            <span>Location</span>
                            <strong>
                                ${drive.location || "Not Available"}
                            </strong>
                        </div>

                        <div class="detail">
                            <span>Minimum CGPA</span>
                            <strong>
                                ${drive.minCgpa != null
                                    ? drive.minCgpa
                                    : "Not Available"}
                            </strong>
                        </div>

                                </div>

            <button
                class="apply-btn"
                id="applyBtn-${drive.driveId}"
                onclick="applyForDrive(${drive.driveId}, this)"
                ${drive.alreadyApplied ? "disabled" : ""}
            >
                ${drive.alreadyApplied ? "Already Applied" : "Apply Now"}
            </button>

        </div>

    `).join("");

        } catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="empty">
                    Unable to load upcoming drives.
                </div>
            `;
        }
    }

    function formatDate(value) {

        if (!value) {
            return "Not Available";
        }

        const date = new Date(value + "T00:00:00");

        if (isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });
    }

    loadUpcomingDrives();

</script>

</body>
</html>
