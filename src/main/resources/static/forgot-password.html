<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RecruitEase</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #08122b, #142a61, #57218f);
        }

        .card {
            width: 100%;
            max-width: 470px;
            padding: 34px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #1d2d6e;
            text-align: center;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        label {
            display: block;
            font-weight: 700;
            color: #344054;
            margin: 14px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5b43d6;
            box-shadow: 0 0 0 3px rgba(91, 67, 214, 0.15);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 48px;
        }

        .password-box span {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            margin-top: 22px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #253fa7, #7b2cbf);
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(81, 53, 186, 0.25);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 11px;
            border-radius: 9px;
            font-size: 14px;
            text-align: center;
        }

        .message.success {
            display: block;
            color: #067647;
            background: #ecfdf3;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fef3f2;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 700;
            margin-top: 22px;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="logo">RecruitEase</div>
        <h2>Forgot Password</h2>

        <p class="subtitle">
            Enter your username and registered email to receive a 6-digit OTP.
        </p>

        <!-- STEP 1 -->
        <div class="step active" id="emailStep">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
            >

            <label for="email">Registered Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
            >

            <button id="sendOtpBtn" onclick="sendOtp()">Send OTP</button>
        </div>

        <!-- STEP 2 -->
        <div class="step" id="resetStep">

            <label for="otp">6-Digit OTP</label>
            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                placeholder="Enter OTP"
            >

            <label for="newPassword">New Password</label>
            <div class="password-box">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Minimum 6 characters"
                >
                <span onclick="togglePassword('newPassword', this)">👁</span>
            </div>

            <label for="confirmPassword">Confirm New Password</label>
            <div class="password-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter new password"
                >
                <span onclick="togglePassword('confirmPassword', this)">👁</span>
            </div>

            <button id="resetBtn" onclick="resetPassword()">
                Reset Password
            </button>
        </div>

        <div id="messageBox" class="message"></div>

        <a href="student-login.html" class="back-link">
            ← Back to Student Login
        </a>
    </div>

    <script>
        let verifiedUsername = "";
        let registeredEmail = "";

        function showMessage(message, type) {
            const messageBox = document.getElementById("messageBox");
            messageBox.textContent = message;
            messageBox.className = "message " + type;
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "🙈";
            } else {
                input.type = "password";
                icon.textContent = "👁";
            }
        }

        async function sendOtp() {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const sendOtpBtn = document.getElementById("sendOtpBtn");

            if (!username || !email) {
                showMessage("Please enter username and registered email.", "error");
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = "Sending OTP...";

            try {
                const response = await fetch(
                    "/api/student-login/forgot-password/send-otp",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: username,
                            email: email
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    showMessage(
                        result.message || "OTP could not be sent.",
                        "error"
                    );
                    return;
                }

                verifiedUsername = username;
                registeredEmail = email;

                showMessage(result.message, "success");

                document.getElementById("emailStep").classList.remove("active");
                document.getElementById("resetStep").classList.add("active");

            } catch (error) {
                showMessage("Server error. Please try again.", "error");
            } finally {
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = "Send OTP";
            }
        }

        async function resetPassword() {
            const otp = document.getElementById("otp").value.trim();
            const newPassword = document.getElementById("newPassword").value.trim();
            const confirmPassword =
                document.getElementById("confirmPassword").value.trim();

            const resetBtn = document.getElementById("resetBtn");

            if (!otp || !newPassword || !confirmPassword) {
                showMessage("Please fill all fields.", "error");
                return;
            }

            if (!/^\d{6}$/.test(otp)) {
                showMessage("Please enter a valid 6-digit OTP.", "error");
                return;
            }

            if (newPassword.length < 6) {
                showMessage(
                    "New password must contain at least 6 characters.",
                    "error"
                );
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage(
                    "New password and confirm password do not match.",
                    "error"
                );
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = "Resetting Password...";

            try {
                const response = await fetch(
                    "/api/student-login/forgot-password/reset",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: verifiedUsername,
                            email: registeredEmail,
                            otp: otp,
                            newPassword: newPassword
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    showMessage(
                        result.message || "Password reset failed.",
                        "error"
                    );
                    return;
                }

                showMessage(result.message, "success");

                setTimeout(() => {
                    window.location.href = "student-login.html";
                }, 1800);

            } catch (error) {
                showMessage("Server error. Please try again.", "error");
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = "Reset Password";
            }
        }
    </script>

</body>
</html>
