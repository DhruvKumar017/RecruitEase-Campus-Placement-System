<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Admin Access - RecruitEase</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            padding:30px;
            color:#ffffff;
            background:
                radial-gradient(circle at 15% 12%,rgba(47,128,255,.20),transparent 28%),
                radial-gradient(circle at 85% 88%,rgba(124,58,237,.22),transparent 30%),
                #050816;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .request-card{
            width:100%;
            max-width:760px;
            padding:38px;
            border:1px solid rgba(96,165,250,.25);
            border-radius:26px;
            background:rgba(13,19,37,.92);
            box-shadow:0 30px 80px rgba(0,0,0,.55);
        }

        .brand{
            text-align:center;
            font-size:30px;
            font-weight:800;
            margin-bottom:24px;
        }

        .brand span{
            color:#2f80ff;
        }

        .request-icon{
            width:82px;
            height:82px;
            margin:0 auto 16px;
            display:grid;
            place-items:center;
            border-radius:50%;
            font-size:40px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            box-shadow:0 16px 35px rgba(47,128,255,.30);
        }

        h1{
            text-align:center;
            font-size:30px;
            margin-bottom:8px;
        }

        .subtitle{
            text-align:center;
            color:#aebbd1;
            margin-bottom:28px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:18px 20px;
        }

        .full{
            grid-column:1 / 3;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            font-weight:600;
        }

        input,
        select,
        textarea{
            width:100%;
            height:56px;
            padding:0 16px;
            outline:none;
            border:1px solid #263a5f;
            border-radius:14px;
            background:#0f172a;
            color:#ffffff;
            font-size:15px;
        }

        textarea{
            height:120px;
            padding-top:15px;
            resize:vertical;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color:#2f80ff;
            box-shadow:0 0 0 4px rgba(47,128,255,.12);
        }

        select option{
            background:#0f172a;
            color:#ffffff;
        }

        button{
            width:100%;
            height:56px;
            margin-top:26px;
            border:none;
            border-radius:14px;
            background:linear-gradient(90deg,#2563eb,#2f80ff);
            color:#ffffff;
            font-size:17px;
            font-weight:800;
            cursor:pointer;
            transition:.25s;
            box-shadow:0 15px 35px rgba(37,99,235,.28);
        }

        button:hover{
            transform:translateY(-4px);
            box-shadow:0 22px 45px rgba(37,99,235,.40);
        }

        .back-link{
            display:block;
            margin-top:20px;
            color:#79b2ff;
            text-align:center;
            text-decoration:none;
            font-weight:600;
        }

        .back-link:hover{
            color:#c084fc;
        }

        @media(max-width:650px){
            body{
                padding:16px;
            }

            .request-card{
                padding:28px 20px;
            }

            .form-grid{
                grid-template-columns:1fr;
            }

            .full{
                grid-column:1;
            }

            h1{
                font-size:25px;
            }
        }
    </style>
</head>

<body>

    <main class="request-card">

        <div class="brand">🎓 Recruit<span>Ease</span></div>

        <div class="request-icon">🛡️</div>

        <h1>Request Admin Access</h1>

        <p class="subtitle">
            Fill this form. Main Admin approval ke baad hi dashboard access milega.
        </p>

        <form id="adminRequestForm">

            <div class="form-grid">

                <div>
                    <label>Full Name *</label>
                    <input type="text" id="fullName"
                           placeholder="Enter your full name" required>
                </div>

                <div>
                    <label>Email Address *</label>
                    <input type="email" id="email"
                           placeholder="Enter your email" required>
                </div>

                <div>
                    <label>Phone Number *</label>
                    <input type="text" id="phoneNumber"
                           placeholder="Enter phone number" required>
                </div>

                <div>
                    <label>Department *</label>
                    <select id="department" required>
                        <option value="">Select department</option>
                        <option>Training and Placement</option>
                        <option>Computer Science</option>
                        <option>Administration</option>
                        <option>Faculty Coordinator</option>
                        <option>Other</option>
                    </select>
                </div>

                <div>
                    <label>Requested Username *</label>
                    <input type="text" id="requestedUsername"
                           placeholder="Choose admin username" required>
                </div>

                <div>
                    <label>Requested Password *</label>
                    <input type="password" id="requestedPassword"
                           placeholder="Create password" required>
                </div>

                <div class="full">
                    <label>Why do you need admin access? *</label>
                    <textarea id="reason"
                        placeholder="Write your role and reason for admin access..."
                        required></textarea>
                </div>

            </div>

            <button type="submit">Submit Admin Request →</button>

        </form>

        <a class="back-link" href="admin-login.html">
            ← Back to Admin Login
        </a>

    </main>

    <script>
        document.getElementById("adminRequestForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const requestData = {
                    fullName: document.getElementById("fullName").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    phoneNumber: document.getElementById("phoneNumber").value.trim(),
                    department: document.getElementById("department").value,
                    requestedUsername: document.getElementById("requestedUsername").value.trim(),
                    requestedPassword: document.getElementById("requestedPassword").value.trim(),
                    reason: document.getElementById("reason").value.trim()
                };

                try {
                    const response = await fetch("/api/admin-requests", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(requestData)
                    });

                    const message = await response.text();

                    if (!response.ok) {
                        alert("❌ " + message);
                        return;
                    }

                    alert(
                        "✅ Admin access request submitted successfully. " +
                        "Please wait for Main Admin approval."
                    );

                    document.getElementById("adminRequestForm").reset();

                    window.location.href = "admin-login.html";

                } catch (error) {
                    console.error(error);
                    alert("❌ Unable to submit request. Backend check karo.");
                }
            });
    </script>

</body>
</html>
